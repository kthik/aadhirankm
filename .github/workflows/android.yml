name: Build Android APK

# Builds the installable APK in CI, so no Android toolchain is needed locally.
# The finished file is attached to the run as an artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Installs the SDK and accepts its licences; compileSdk is 36.
      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm --prefix client ci
          npm --prefix veeran-app ci

      - name: Build the web client
        run: npm --prefix client run build

      - name: Copy the build into the Android project
        working-directory: veeran-app
        run: npx cap sync android

      - name: Assemble the debug APK
        working-directory: veeran-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: veeran-debug-apk
          path: veeran-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
